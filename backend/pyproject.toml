[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-studio-backend"
version = "1.0.0"
description = "Local-first TTS Studio backend: Kokoro, Kitten, Pocket and Piper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psutil>=5.9",
    "soundfile>=0.12",
    "numpy>=1.26",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9.4", "soundfile>=0.12"]
"kokoro-ja" = ["misaki[ja]"]
"kokoro-zh" = ["misaki[zh]"]
kitten = ["kittenml>=0.9.4"]
pocket = ["pocket-tts>=3.3.0"]
piper = ["piper-tts>=1.5"]
all = [
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    "misaki[ja]",
    "misaki[zh]",
    "kittenml>=0.9.4",
    "pocket-tts>=3.3.0",
    "piper-tts>=1.5",
]

[tool.setuptools]
packages = ["app", "app.engines", "app.routers"]
