[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-studio"
version = "1.0.0"
description = "Local-first text-to-speech studio: run 'tts-studio' and your browser opens - Kokoro, Kitten, Pocket and Piper in one app, no API keys"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "opengptloop" }]
keywords = [
    "tts",
    "text-to-speech",
    "speech-synthesis",
    "kokoro",
    "kitten-tts",
    "piper",
    "voice-cloning",
    "audio",
    "local-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psutil>=5.9",
    "soundfile>=0.12",
    "numpy>=1.26",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9.4", "soundfile>=0.12"]
"kokoro-ja" = ["misaki[ja]"]
"kokoro-zh" = ["misaki[zh]"]
kitten = ["kittenml>=0.9.4"]
pocket = ["pocket-tts>=3.3.0"]
piper = ["piper-tts>=1.5"]
all = [
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    "misaki[ja]",
    "misaki[zh]",
    "kittenml>=0.9.4",
    "pocket-tts>=3.3.0",
    "piper-tts>=1.5",
]

[project.urls]
Homepage = "https://github.com/opengptloop/tts-studio"
Repository = "https://github.com/opengptloop/tts-studio"
Issues = "https://github.com/opengptloop/tts-studio/issues"

[project.scripts]
tts-studio = "tts_studio.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["tts_studio*"]

[tool.setuptools.package-data]
tts_studio = ["frontend_dist/*", "frontend_dist/assets/*"]
